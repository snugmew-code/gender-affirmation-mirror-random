<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Random Transformation</title>
    </head>
    <body>
        <p id="status">Choosing your transformation...</p>

        <script>
            async function loadTransformations() {
                const response = await fetch("./transformations.json");
                if (!response.ok) {
                    throw new Error("Could not load transformations.json");
                }
                return await response.json();
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            async function pickRandomTransformation() {
                const transformations = (await loadTransformations()).filter((t) => t.enabled !== false);

                if (!Array.isArray(transformations) || transformations.length === 0) {
                    throw new Error("No transformations found.");
                }

                const key = "transformationShuffleBag";
                let state = {};

                try {
                    state = JSON.parse(localStorage.getItem(key)) || {};
                } catch (e) {
                    state = {};
                }

                // Create a signature so the bag resets automatically if the JSON changes
                const signature = JSON.stringify(
                    transformations.map((t) => ({
                        name: t.name,
                        url: t.url,
                    }))
                );

                if (state.signature !== signature) {
                    state = {
                        signature,
                        remaining: [],
                        last: -1,
                    };
                }

                if (state.remaining.length === 0) {
                    state.remaining = transformations.map((_, i) => i);
                    shuffle(state.remaining);

                    // Prevent the same result twice in a row across reshuffles
                    const lastIndex = state.remaining.length - 1;
                    if (lastIndex > 0 && state.remaining[lastIndex] === state.last) {
                        [state.remaining[0], state.remaining[lastIndex]] = [
                            state.remaining[lastIndex],
                            state.remaining[0],
                        ];
                    }
                }

                const chosenIndex = state.remaining.pop();
                state.last = chosenIndex;

                localStorage.setItem(key, JSON.stringify(state));

                const chosen = transformations[chosenIndex];

                // Optional: show the chosen name briefly
                document.getElementById("status").textContent = `Chosen transformation: ${chosen.name}`;

                window.location.replace(chosen.url);
            }

            pickRandomTransformation().catch((error) => {
                document.getElementById("status").textContent = "Error: " + error.message;
                console.error(error);
            });
        </script>
    </body>
</html>
